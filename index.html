<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Quiz for You</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Prevent scrolling */
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #question {
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        .button {
            background: #ff6b9d;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            position: absolute;
            animation: float 3s ease-in-out infinite;
            transition: left 1s ease, top 1s ease; /* Add this line for smooth repositioning */
        }
        .button:hover {
            background: #ff4a7d;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .float-away {
            animation: floatAway 1s ease-out forwards;
        }
        @keyframes floatAway {
            0% { opacity: 1; transform: translateY(0px); }
            100% { opacity: 0; transform: translateY(-100px) rotate(45deg); }
        }/* ... existing body, h1, #question styles ... */

.button {
    background: #ff6b9d;
    border: none;
    color: white;
    padding: 15px 30px;
    font-size: 1.2em;
    border-radius: 50px;
    cursor: pointer;
    position: absolute;
    transition: all 0.3s ease; /* Smooth movement */
}
.button:hover {
    background: #ff4a7d;
}
/* Remove the old @keyframes float and .float-away */

.run-away {
    animation: runAway 0.5s ease-out forwards;
}
@keyframes runAway {
    0% { transform: scale(1); }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(0.8) rotate(-10deg); } /* Quick shrink/rotate to simulate running */
}

/* ... existing #end-message ... */
        #end-message {
            display: none;
            font-size: 2em;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day</h1>
    <h2>Mrs.Shreyashi Trivedi Singh 💖</h2>
    <div id="question"></div>
    <div id="buttons"></div>
    <div id="end-message">You did it! I love you more than words can say. ❤️</div>

    <script>
        const questions = [
            {
                question: "Where we meet first time?",
                options: ["Instagram", "Whatsapp", "Snapchat", "Facebook"],
                correct: "Snapchat" // Not used for scoring, just for flow
            },
            {
                question: "Where did I romantically touch my lips to yours?",
                options: ["Passage", "Restaurant", "Temple", "Home"],
                correct: "Passage"
            },
            {
                question: "What's the one thing I love most about you?",
                options: ["Your smile", "Your eyes", "Your laugh", "your simplicity"],
                correct: "your simplicity"
            },
            {
                question: "What's the best time you spend with me?",
                options: ["On Phone", "In School", "In Bus", "At Temple"],
                correct: "In Bus"
            }
        ];

        let currentQuestionIndex = 0;
        const questionEl = document.getElementById('question');
        const buttonsEl = document.getElementById('buttons');
        const endMessageEl = document.getElementById('end-message');

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionEl.style.display = 'none';
                buttonsEl.innerHTML = '';
                endMessageEl.style.display = 'block';
                return;
            }

            const q = questions[currentQuestionIndex];
            questionEl.textContent = q.question;
            buttonsEl.innerHTML = '';

            q.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'button';
                button.textContent = option;
                button.style.left = Math.random() * 80 + '%'; // Random horizontal position
                button.style.top = Math.random() * 60 + 20 + '%'; // Random vertical position
                button.addEventListener('click', () => {
                    button.classList.add('float-away');
                    setTimeout(() => {
                        currentQuestionIndex++;
                        loadQuestion();
                    }, 1000); // Wait for animation
                });
                buttonsEl.appendChild(button);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
